name: Convert SVG to PNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Convert SVG files to PNG (1024px width)
        run: |
          set -e
          shopt -s globstar
          mkdir -p png
          found=0
          while IFS= read -r -d $'\0' file; do
            found=1
            relpath="${file#./}"
            out="png/${relpath%.svg}.png"
            outdir=$(dirname "$out")
            mkdir -p "$outdir"
            echo "Converting $file -> $out"
            rsvg-convert -w 1024 "$file" -o "$out" || (echo "rsvg-convert failed for $file"; exit 1)
          done < <(find . -type f -name "*.svg" -print0)
          if [ "$found" -eq 0 ]; then
            echo "No SVG files found."
            exit 0
          fi

      - name: Commit and push PNGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add png || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add PNG exports of SVGs (1024px)"
          git push origin HEAD:${{ github.ref_name }}
