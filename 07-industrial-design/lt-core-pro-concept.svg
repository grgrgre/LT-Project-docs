<svg width="900" height="1200" viewBox="0 0 900 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1200" fill="#F5F7F8"/>
  <rect width="900" height="132" fill="#172026"/>
  <text x="56" y="66" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">LT Core Pro</text>
  <text x="56" y="102" fill="#B7C3CC" font-family="Inter, Arial, sans-serif" font-size="17">Future higher-end Core variant with Linux, dock, and shared-bus direction.</text>

  <rect x="56" y="176" width="788" height="900" rx="12" fill="#FFFFFF" stroke="#D7DEE5"/>
  <rect x="56" y="176" width="788" height="10" fill="#D97A00"/>

  <g id="device">
    <rect x="202" y="276" width="496" height="438" rx="30" fill="#D7DEE5"/>
    <rect x="190" y="264" width="496" height="438" rx="30" fill="#151B20" stroke="#090D10" stroke-width="2"/>
    <rect x="190" y="310" width="12" height="292" rx="5" fill="#7A8894"/>
    <rect x="674" y="310" width="12" height="292" rx="5" fill="#7A8894"/>
    <rect x="230" y="304" width="416" height="188" rx="11" fill="#070A0D" stroke="#4B5A65"/>
    <rect x="250" y="326" width="376" height="144" rx="5" fill="#DBE4EE"/>
    <text x="274" y="360" fill="#372400" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">LT CORE PRO</text>
    <text x="274" y="396" fill="#372400" font-family="Inter, Arial, sans-serif" font-size="16">Linux shell: ready</text>
    <text x="274" y="423" fill="#372400" font-family="Inter, Arial, sans-serif" font-size="16">Module bus: 2 lanes</text>
    <text x="274" y="450" fill="#372400" font-family="Inter, Arial, sans-serif" font-size="16">Dock: attached</text>
    <rect x="246" y="530" width="166" height="96" rx="9" fill="#222D35" stroke="#B87923"/>
    <text x="274" y="566" fill="#F6D59A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Compute</text>
    <text x="274" y="592" fill="#F6D59A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">module</text>
    <rect x="438" y="530" width="184" height="96" rx="9" fill="#222D35" stroke="#B87923"/>
    <text x="472" y="566" fill="#F6D59A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Internal</text>
    <text x="472" y="592" fill="#F6D59A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">expansion</text>
    <circle cx="630" cy="576" r="30" fill="#090D10" stroke="#7B8A97"/>
    <circle cx="630" cy="576" r="12" fill="#2B3942" stroke="#B87923"/>
    <rect x="252" y="650" width="396" height="42" rx="8" fill="#25323B" stroke="#5F7180"/>
    <rect x="372" y="726" width="156" height="9" rx="5" fill="#B87923"/>
  </g>

  <g id="chips" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="112" y="768" width="126" height="36" rx="7" fill="#FFF5E8" stroke="#D97A00"/>
    <text x="128" y="791" fill="#6A3C00">Linux path</text>
    <rect x="254" y="768" width="190" height="36" rx="7" fill="#FFF5E8" stroke="#D97A00"/>
    <text x="270" y="791" fill="#6A3C00">Pi Zero 2 W research</text>
    <rect x="460" y="768" width="86" height="36" rx="7" fill="#FFF5E8" stroke="#D97A00"/>
    <text x="476" y="791" fill="#6A3C00">Dock</text>
    <rect x="562" y="768" width="118" height="36" rx="7" fill="#FFF5E8" stroke="#D97A00"/>
    <text x="578" y="791" fill="#6A3C00">Shared bus</text>
  </g>

  <text x="112" y="862" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Pro constraints</text>
  <g fill="#344054" font-family="Inter, Arial, sans-serif" font-size="17">
    <circle cx="120" cy="904" r="4" fill="#D97A00"/><text x="140" y="910">Pro features extend LT Core, not fork the ecosystem.</text>
    <circle cx="120" cy="940" r="4" fill="#D97A00"/><text x="140" y="946">Reuse firmware modules, connector concepts, and docs.</text>
    <circle cx="120" cy="976" r="4" fill="#D97A00"/><text x="140" y="982">Compute choice stays research until requirements are stable.</text>
    <circle cx="120" cy="1012" r="4" fill="#D97A00"/><text x="140" y="1018">Dock workflows are future architecture work.</text>
  </g>

  <rect x="112" y="1046" width="676" height="1" fill="#D7DEE5"/>
  <text x="112" y="1080" fill="#42515C" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Status: future concept. Do not let Pro-only ideas complicate the LT Mini MVP.</text>
</svg>
