  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="112" y="612" width="120" height="36" rx="7" fill="#F1F0FF" stroke="#6B5CFF"/>
    <text x="128" y="635" fill="#37307A">QWERTY</text>
    <rect x="248" y="612" width="142" height="36" rx="7" fill="#F1F0FF" stroke="#6B5CFF"/>
    <text x="264" y="635" fill="#37307A">Terminal input</text>
    <rect x="406" y="612" width="128" height="36" rx="7" fill="#F1F0FF" stroke="#6B5CFF"/>
    <text x="422" y="635" fill="#37307A">Attachable</text>
    <rect x="550" y="612" width="118" height="36" rx="7" fill="#F1F0FF" stroke="#6B5CFF"/>
    <text x="566" y="635" fill="#37307A">Module bus</text>
