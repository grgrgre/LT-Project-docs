  <text x="112" y="704" fill="#172026" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Design rules</text>
  <g fill="#344054" font-family="Inter, Arial, sans-serif" font-size="17">
    <circle cx="120" cy="746" r="4" fill="#6B5CFF"/><text x="140" y="752">Base devices must remain usable without this module.</text>
    <circle cx="120" cy="782" r="4" fill="#6B5CFF"/><text x="140" y="788">Firmware exposes key events, not raw GPIO details.</text>
    <circle cx="120" cy="818" r="4" fill="#6B5CFF"/><text x="140" y="824">Mechanical mounting and connector pinout are TBD.</text>
  </g>
